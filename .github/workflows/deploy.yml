name: CI/CD Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/kouakou-christ-axel/cfnouchici

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Cache du client Prisma
        id: prisma-cache
        uses: actions/cache@v4
        with:
          path: src/generated/prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}

      - name: Génération du client Prisma
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Vérification TypeScript
        run: pnpm tsc --noEmit

      - name: Tests
        run: pnpm test --passWithNoTests

  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement Dokploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Déclenchement du webhook Dokploy
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
