  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nouchici
      POSTGRES_PASSWORD: nouchici
      POSTGRES_DB: nouchici
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nouchici"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
